---
# users without the password hash: loops run over this list, so the hash never becomes part of a loop item
# (items are logged in plain text); the user task looks it up by name
- name: Users without password hashes (for loops)
  ansible.builtin.set_fact:
    user_users: >-
      {{ user.users | default([]) | map('dict2items')
         | map('rejectattr', 'key', 'equalto', 'password') | map('items2dict') | list }}

- name: Build group name to gid map
  ansible.builtin.set_fact:
    user_group_gid_map: "{{ user_group_gid_map | default({}) | combine({ item.name: item.gid }) }}"
  loop: "{{ user.groups | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.gid is defined

- name: Ensure home path ownership for user users
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}"
    state: directory
    owner: "{{ item.uid | default(omit) }}"
    group: "{{ user_group_gid_map[item.group | default(item.name)] | default(omit) }}"
    mode: "0700"
  loop: "{{ user_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'present'

- name: Ensure user groups exist
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    state: present
  loop: "{{ user.groups | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# before the group change: a user losing a group (e.g. wheel) keeps sudo through this file, so the admin running
# ansible is never locked out
- name: Sudo rules for users
  ansible.builtin.template:
    src: sudoers-user.j2
    dest: "/etc/sudoers.d/50-ansible-user-{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ user_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.sudo | default(false) | bool
    - item.state | default('present') == 'present'

- name: Remove sudo rules of users without sudo
  ansible.builtin.file:
    path: "/etc/sudoers.d/50-ansible-user-{{ item.name }}"
    state: absent
  loop: "{{ user_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.sudo | default(false) | bool) or item.state | default('present') != 'present'

# secondary groups are desired state: exactly the listed groups, all others are removed
# (an empty list removes all secondary groups)
- name: Ensure user users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid | default(omit) }}"
    group: "{{ item.group | default(item.name) }}"
    groups: "{{ item.groups | default([]) | join(',') }}"
    append: false
    shell: "{{ item.shell | default('/bin/bash') }}"
    home: "{{ item.home | default('/home/' ~ item.name) }}"
    create_home: "{{ item.create_home | default(true) }}"
    password: "{{ (user.users | selectattr('name', 'equalto', item.name) | first).password | default(omit) }}"
    update_password: "{{ item.update_password | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ user_users }}"
  loop_control:
    label: "{{ item.name }}"
